<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A84FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Jeeru">
<meta name="description" content="Jeeru — a private chat just for two.">
<title>Jeeru</title>
<style>
  :root{
    --blue:#0A84FF;
    --blue-dark:#0060DF;
    --bg-light:#F2F2F7;
    --bg-dark:#000000;
    --bubble-in-light:#E9E9EB;
    --bubble-in-dark:#262628;
    --text-light:#000000;
    --text-dark:#F5F5F7;
    --sub-light:#8E8E93;
    --sub-dark:#8E8E93;
    --panel-light:rgba(255,255,255,0.85);
    --panel-dark:rgba(20,20,22,0.85);
    --sep-light:rgba(60,60,67,0.29);
    --sep-dark:rgba(84,84,88,0.6);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --spring: cubic-bezier(.34,1.56,.64,1);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--font);
    background:var(--bg-light);
    color:var(--text-light);
    overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background .4s cubic-bezier(.4,0,.2,1), color .4s cubic-bezier(.4,0,.2,1);
  }
  body.dark{ background:var(--bg-dark); color:var(--text-dark); }

  #app{ height:100vh; width:100vw; max-width:560px; margin:0 auto; display:flex; flex-direction:column; position:relative; background:inherit; overflow:hidden; }

  /* ---------- LOGIN ---------- */
  #login{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; z-index:50; background:var(--bg-light); overflow:hidden;
    transition:background .4s cubic-bezier(.4,0,.2,1), opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1), filter .5s ease;
  }
  body.dark #login{ background:var(--bg-dark); }
  #login.leaving{ opacity:0; transform:scale(1.06); filter:blur(6px); pointer-events:none; }

  .blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:0.35; will-change:transform; }
  .blob1{ width:260px; height:260px; background:#0A84FF; top:-60px; left:-60px; animation:float1 9s ease-in-out infinite; }
  .blob2{ width:220px; height:220px; background:#FF375F; bottom:-40px; right:-50px; animation:float2 11s ease-in-out infinite; }
  .blob3{ width:180px; height:180px; background:#5AC8FA; bottom:20%; left:-70px; animation:float1 13s ease-in-out infinite reverse; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(30px,20px) scale(1.08); } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(-25px,-15px) scale(1.06); } }

  .login-badge{
    width:88px; height:88px; border-radius:24px; margin-bottom:20px;
    box-shadow:0 12px 28px rgba(10,132,255,0.3), 0 2px 6px rgba(10,132,255,0.2);
    animation:pop .7s var(--spring); position:relative; z-index:1; object-fit:cover;
  }
  @keyframes pop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .login-title{ font-size:27px; font-weight:700; letter-spacing:-0.02em; margin-bottom:4px; position:relative; z-index:1; animation:riseUp .6s var(--spring) both; animation-delay:.05s; }
  .login-sub{ font-size:14px; color:var(--sub-light); margin-bottom:28px; text-align:center; position:relative; z-index:1; animation:riseUp .6s var(--spring) both; animation-delay:.1s; }
  @keyframes riseUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  #phoneInput{
    width:100%; max-width:280px; padding:14px 16px; border-radius:14px; border:none;
    background:var(--bubble-in-light); color:var(--text-light); font-size:17px; text-align:center;
    letter-spacing:0.5px; outline:none; transition:box-shadow .25s var(--spring), background .3s;
    position:relative; z-index:1; animation:riseUp .6s var(--spring) both; animation-delay:.15s;
  }
  body.dark #phoneInput{ background:var(--bubble-in-dark); color:var(--text-dark); }
  #phoneInput:focus{ box-shadow:0 0 0 4px rgba(10,132,255,0.28); }
  #loginBtn{
    margin-top:16px; width:100%; max-width:280px; padding:14px; border:none; border-radius:14px;
    background:var(--blue); color:#fff; font-size:17px; font-weight:600; cursor:pointer;
    transition:transform .15s var(--spring), opacity .2s, box-shadow .2s;
    position:relative; z-index:1; animation:riseUp .6s var(--spring) both; animation-delay:.2s;
    box-shadow:0 6px 16px rgba(10,132,255,0.3);
  }
  #loginBtn:active{ transform:scale(0.94); box-shadow:0 2px 8px rgba(10,132,255,0.25); }
  #loginBtn:disabled{ opacity:0.4; }
  #loginError{ margin-top:14px; font-size:13px; color:#FF453A; min-height:16px; position:relative; z-index:1; animation:shake .4s; }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }

  /* ---------- NAV BAR ---------- */
  #navbar{
    position:relative; z-index:10; padding:14px 16px 12px; display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    background:var(--panel-light); border-bottom:0.5px solid var(--sep-light);
    transition:background .35s, border-color .35s;
    opacity:0; transform:translateY(-14px);
  }
  #navbar.in{ animation:slideDown .5s var(--spring) forwards; }
  @keyframes slideDown{ to{ opacity:1; transform:translateY(0); } }
  body.dark #navbar{ background:var(--panel-dark); border-color:var(--sep-dark); }
  #navLogo{ width:26px; height:26px; border-radius:8px; flex-shrink:0; object-fit:cover; }
  .avatar{
    width:36px; height:36px; border-radius:50%; background:linear-gradient(160deg,#FF9F0A,#FF375F);
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:#fff;
    flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.15); transition:transform .3s var(--spring);
  }
  #navbar:active .avatar{ transform:scale(0.92); }
  #navName{ font-size:16px; font-weight:600; letter-spacing:-0.01em; }
  #navSub{ font-size:12px; color:var(--sub-light); margin-top:1px; display:flex; align-items:center; gap:4px; }
  .dot-live{ width:6px; height:6px; border-radius:50%; background:#30D158; display:inline-block; animation:pulse 2s infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  #themeToggle{
    margin-left:auto; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:var(--bubble-in-light); font-size:16px; display:flex; align-items:center; justify-content:center;
    transition:transform .35s var(--spring), background .3s;
  }
  body.dark #themeToggle{ background:var(--bubble-in-dark); }
  #themeToggle:active{ transform:scale(0.85) rotate(25deg); }
  #themeToggle.spin{ animation:spin360 .5s var(--spring); }
  @keyframes spin360{ from{ transform:rotate(0deg) scale(0.7); } to{ transform:rotate(360deg) scale(1); } }

  /* ---------- MESSAGES ---------- */
  #messages{
    flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:2px;
    -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
    opacity:0; transition:opacity .4s var(--ease);
  }
  #messages.in{ opacity:1; }
  .day-sep{ text-align:center; font-size:12px; color:var(--sub-light); margin:14px 0 6px; font-weight:600;
    animation:riseIn .3s var(--ease) both; }
  .row{ display:flex; width:100%; margin:2px 0; position:relative; }
  .row.me{ justify-content:flex-end; }
  .row.them{ justify-content:flex-start; }
  .bubble-wrap{ max-width:76%; display:flex; flex-direction:column; }
  .row.me .bubble-wrap{ align-items:flex-end; }
  .row.them .bubble-wrap{ align-items:flex-start; }

  .bubble{
    padding:9px 14px; border-radius:20px; font-size:15.5px; line-height:1.32; word-wrap:break-word;
    position:relative; cursor:pointer; user-select:none;
    animation:riseIn .4s var(--spring);
    transition:transform .15s var(--spring), box-shadow .15s;
    box-shadow:0 1px 1px rgba(0,0,0,0.04);
    transform-origin:bottom center;
  }
  .row.me .bubble{ transform-origin:bottom right; }
  .row.them .bubble{ transform-origin:bottom left; }
  .bubble:active{ transform:scale(0.96); }
  @keyframes riseIn{ from{ opacity:0; transform:translateY(12px) scale(.85); } 60%{ opacity:1; } to{ opacity:1; transform:translateY(0) scale(1); } }

  .row.me .bubble{ background:linear-gradient(160deg,#2B9BFF,#0068E0); color:#fff; border-bottom-right-radius:6px; }
  .row.them .bubble{ background:var(--bubble-in-light); color:var(--text-light); border-bottom-left-radius:6px; }
  body.dark .row.them .bubble{ background:var(--bubble-in-dark); color:var(--text-dark); }

  /* iMessage-style tails */
  .row.me .bubble.tail::after{
    content:''; position:absolute; right:-6px; bottom:0; width:14px; height:16px;
    background:inherit; border-bottom-left-radius:10px 12px;
    -webkit-mask:radial-gradient(circle 9px at 0 0, transparent 98%, #000 100%);
    mask:radial-gradient(circle 9px at 0 0, transparent 98%, #000 100%);
  }
  .row.them .bubble.tail::after{
    content:''; position:absolute; left:-6px; bottom:0; width:14px; height:16px;
    background:var(--bubble-in-light); border-bottom-right-radius:10px 12px;
    -webkit-mask:radial-gradient(circle 9px at 100% 0, transparent 98%, #000 100%);
    mask:radial-gradient(circle 9px at 100% 0, transparent 98%, #000 100%);
  }
  body.dark .row.them .bubble.tail::after{ background:var(--bubble-in-dark); }

  .meta{ font-size:11px; color:var(--sub-light); margin-top:3px; padding:0 4px; display:flex; gap:5px; align-items:center;
    animation:fadeIn .4s var(--ease) both; animation-delay:.1s; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .reactions{ display:flex; gap:2px; margin-top:-8px; z-index:2; }
  .row.me .reactions{ margin-right:6px; }
  .row.them .reactions{ margin-left:6px; }
  .reaction-chip{
    background:var(--panel-light); border:0.5px solid var(--sep-light); border-radius:10px; font-size:12px;
    padding:1px 5px; box-shadow:0 2px 6px rgba(0,0,0,0.15); animation:pop .35s var(--spring);
  }
  body.dark .reaction-chip{ background:#1c1c1e; border-color:var(--sep-dark); }

  /* emoji picker */
  #emojiBar{
    position:fixed; z-index:80; display:flex; gap:6px; background:var(--panel-light); backdrop-filter:blur(20px);
    border-radius:22px; padding:8px 10px; box-shadow:0 14px 34px rgba(0,0,0,0.22); transform:scale(.4) translateY(10px); opacity:0;
    transition:transform .28s var(--spring), opacity .2s; pointer-events:none; transform-origin:bottom center;
  }
  body.dark #emojiBar{ background:var(--panel-dark); }
  #emojiBar.show{ transform:scale(1) translateY(0); opacity:1; pointer-events:auto; }
  #emojiBar span{ font-size:22px; cursor:pointer; transition:transform .18s var(--spring); display:inline-block; }
  #emojiBar span:active{ transform:scale(1.5) rotate(-8deg); }
  #emojiBar span.picked{ animation:pickPulse .4s var(--spring); }
  @keyframes pickPulse{ 0%{ transform:scale(1);} 40%{ transform:scale(1.7);} 100%{ transform:scale(1);} }

  /* typing indicator */
  .typing-bubble{
    background:var(--bubble-in-light); border-radius:20px; border-bottom-left-radius:6px; padding:12px 16px;
    display:inline-flex; gap:4px; align-items:center; animation:riseIn .35s var(--spring);
  }
  body.dark .typing-bubble{ background:var(--bubble-in-dark); }
  .typing-bubble span{ width:6px; height:6px; border-radius:50%; background:var(--sub-light); display:inline-block; animation:bounce 1.1s infinite ease-in-out; }
  .typing-bubble span:nth-child(2){ animation-delay:.15s; }
  .typing-bubble span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-5px); opacity:1; } }

  /* empty state */
  #emptyState{ margin:auto; text-align:center; color:var(--sub-light); padding:40px; }
  #emptyState .big{ font-size:44px; margin-bottom:10px; }

  /* ---------- INPUT BAR ---------- */
  #inputbar{
    display:flex; align-items:flex-end; gap:8px; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter:blur(20px); background:var(--panel-light); border-top:0.5px solid var(--sep-light);
    transition:background .35s, border-color .35s;
    opacity:0; transform:translateY(14px);
  }
  #inputbar.in{ animation:slideUp .5s var(--spring) forwards; animation-delay:.05s; }
  @keyframes slideUp{ to{ opacity:1; transform:translateY(0); } }
  body.dark #inputbar{ background:var(--panel-dark); border-color:var(--sep-dark); }
  #msgInput{
    flex:1; border:none; outline:none; resize:none; max-height:100px; min-height:38px;
    padding:9px 16px; border-radius:19px; background:var(--bubble-in-light); color:var(--text-light);
    font-size:15.5px; font-family:var(--font); line-height:1.3;
    transition:background .3s, box-shadow .2s var(--spring);
  }
  #msgInput:focus{ box-shadow:0 0 0 3px rgba(10,132,255,0.22); }
  body.dark #msgInput{ background:var(--bubble-in-dark); color:var(--text-dark); }
  #sendBtn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--blue); color:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:transform .25s var(--spring), opacity .2s, background .2s; margin-bottom:2px;
    box-shadow:0 3px 8px rgba(10,132,255,0.35);
  }
  #sendBtn svg{ transition:transform .25s var(--spring); }
  #sendBtn:active{ transform:scale(0.8); }
  #sendBtn:disabled{ opacity:0.35; box-shadow:none; }
  #sendBtn.pop{ animation:sendPop .4s var(--spring); }
  @keyframes sendPop{ 0%{ transform:scale(1); } 40%{ transform:scale(0.7) rotate(-15deg); } 100%{ transform:scale(1) rotate(0); } }

  #attachBtn{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--bubble-in-light); color:var(--blue);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; margin-bottom:2px;
    transition:transform .2s var(--spring), background .3s;
  }
  body.dark #attachBtn{ background:var(--bubble-in-dark); }
  #attachBtn:active{ transform:scale(0.85) rotate(90deg); }

  #mediaPreviewBar{
    display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel-light);
    border-top:0.5px solid var(--sep-light); animation:riseUp .3s var(--spring);
  }
  body.dark #mediaPreviewBar{ background:var(--panel-dark); border-color:var(--sep-dark); }
  #mediaPreviewThumb{ width:44px; height:44px; border-radius:10px; background-size:cover; background-position:center; background-color:var(--bubble-in-light); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; }
  #mediaPreviewName{ font-size:13.5px; font-weight:600; }
  #mediaPreviewSub{ font-size:12px; color:var(--sub-light); }
  #mediaPreviewCancel{ margin-left:auto; width:26px; height:26px; border-radius:50%; border:none; background:var(--bubble-in-light); color:var(--sub-light); cursor:pointer; transition:transform .15s var(--spring); }
  body.dark #mediaPreviewCancel{ background:var(--bubble-in-dark); }
  #mediaPreviewCancel:active{ transform:scale(0.85); }

  /* media inside bubbles */
  .bubble.media{ padding:4px; background:transparent !important; box-shadow:none; }
  .bubble.media img, .bubble.media video{
    display:block; max-width:240px; max-height:320px; border-radius:16px; cursor:pointer; width:100%; object-fit:cover;
  }
  .bubble.media.tail::after{ display:none; }
  .media-caption{ font-size:14.5px; padding:6px 8px 2px; }

  /* lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:100; display:none; align-items:center; justify-content:center;
    animation:fadeIn .25s ease;
  }
  #lightbox.show{ display:flex; }
  #lightbox img, #lightbox video{ max-width:92vw; max-height:88vh; border-radius:12px; animation:pop .3s var(--spring); }
  #lightboxClose{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); right:16px; width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:16px; cursor:pointer; backdrop-filter:blur(10px);
  }

  /* instagram reel embed */
  .ig-card{
    width:260px; border-radius:16px; overflow:hidden; background:var(--bubble-in-light); cursor:default;
  }
  body.dark .ig-card{ background:var(--bubble-in-dark); }
  .ig-embed-wrap{ min-height:120px; display:flex; align-items:center; justify-content:center; }
  .ig-fallback{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:26px 16px; text-align:center;
  }
  .ig-fallback .ig-icon{
    width:46px; height:46px; border-radius:14px; background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .ig-fallback .ig-label{ font-size:13px; font-weight:600; }
  .ig-fallback .ig-open{
    margin-top:4px; padding:7px 16px; border-radius:14px; background:var(--blue); color:#fff; font-size:12.5px;
    font-weight:600; text-decoration:none; transition:transform .15s var(--spring);
  }
  .ig-fallback .ig-open:active{ transform:scale(0.93); }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>
<div id="app">

  <div id="login">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <img class="login-badge" id="loginLogo" alt="Jeeru">
    <div class="login-title">Jeeru</div>
    <div class="login-sub">Just the two of you.<br>Enter your number to open the chat.</div>
    <input id="phoneInput" type="tel" placeholder="Mobile number" maxlength="10" inputmode="numeric">
    <button id="loginBtn">Continue</button>
    <div id="loginError"></div>
  </div>

  <div id="navbar" style="display:none;">
    <img id="navLogo" alt="Jeeru">
    <div class="avatar" id="navAvatar">B</div>
    <div>
      <div id="navName">Chunnu</div>
      <div id="navSub"><span class="dot-live"></span>just us two</div>
    </div>
    <button id="themeToggle">🌙</button>
  </div>

  <div id="messages" style="display:none;"></div>

  <div id="mediaPreviewBar" style="display:none;">
    <div id="mediaPreviewThumb"></div>
    <div id="mediaPreviewInfo">
      <div id="mediaPreviewName">Photo</div>
      <div id="mediaPreviewSub">Ready to send</div>
    </div>
    <button id="mediaPreviewCancel">✕</button>
  </div>

  <div id="inputbar" style="display:none;">
    <button id="attachBtn" title="Photo or video">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
    <textarea id="msgInput" rows="1" placeholder="Message"></textarea>
    <button id="sendBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12L19 5L15 19L11 13L5 12Z" fill="white"/></svg>
    </button>
  </div>

  <div id="lightbox">
    <button id="lightboxClose">✕</button>
    <img id="lightboxImg" style="display:none;">
    <video id="lightboxVideo" controls playsinline style="display:none;"></video>
  </div>

  <div id="emojiBar">
    <span data-e="❤️">❤️</span><span data-e="😂">😂</span><span data-e="😮">😮</span>
    <span data-e="😢">😢</span><span data-e="🙏">🙏</span><span data-e="👍">👍</span>
  </div>

</div>

  async function safeGet(key, shared){

      if(!res.ok) throw new Error('save failed');
    }catch(e){ console.error('storage set failed', e); throw e; }
  }

  async function appendMessage(msg){

  function fileToDataURL(file){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  function compressImage(file, maxDim, quality){
    return new Promise((res, rej) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = height * (maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = width * (maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = url;
    });
  }

      return;
    }
    await loadAndRender(true);
    pollTimer = setInterval(loadAndRender, POLL_MS);
  }

  let typingState = false;
  function setTyping(isTyping){
    if(typingState === isTyping) return;
    typingState = isTyping;
    safeGet(TYPING_KEY, true).then(t => {
      const obj = t || {};
      obj[ME] = isTyping ? Date.now() : 0;
      safeSet(TYPING_KEY, obj, true);
    });
    if(isTyping){
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => setTyping(false), 2500);
    }
  }

  // ---------- RENDER ----------
  let renderInFlight = false;
  async function loadAndRender(forceScroll){
    // if a previous poll's fetch is still in flight (slow network), skip
    // this tick rather than letting two loads race and stomp on each other
    if(renderInFlight) return;
    renderInFlight = true;
    let list, typing;
    try{
      list = (await fetchMessages()) || [];
      typing = (await safeGet(TYPING_KEY, true)) || {};
    } finally {
      renderInFlight = false;
    }

    const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;

    messagesEl.innerHTML = '';
    if(list.length === 0){
      const empty = document.createElement('div');
      empty.id = 'emptyState';
      empty.innerHTML = '<div class="big">👋</div>Say hi to start the conversation.';
      messagesEl.appendChild(empty);
    } else {
      let lastDay = '';
      list.forEach((m, idx) => {
        const day = new Date(m.ts).toDateString();
        if(day !== lastDay){
          const sep = document.createElement('div');
          sep.className = 'day-sep';
          sep.textContent = formatDay(m.ts);
          messagesEl.appendChild(sep);
          lastDay = day;
        }
        const nextIsSameSender = idx < list.length - 1 && list[idx+1].from === m.from && (new Date(list[idx+1].ts).toDateString() === day);
        messagesEl.appendChild(renderRow(m, idx === list.length - 1, list, !nextIsSameSender));
      });
      // mark other's messages as seen (atomic server-side update — no
      // read-modify-write race with a message being sent at the same time)
      if(list.some(m => m.from === OTHER && !m.seen)){
        markSeenOnServer(OTHER);
      }
    }

    // typing indicator
    const otherTyping = typing[OTHER] && (Date.now() - typing[OTHER] < 3000);
    if(otherTyping){
      const row = document.createElement('div');
      row.className = 'row them';
      row.innerHTML = '<div class="bubble-wrap"><div class="typing-bubble"><span></span><span></span><span></span></div></div>';
      messagesEl.appendChild(row);
    }

    if(wasNearBottom || forceScroll){
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function formatDay(ts){
    const d = new Date(ts), today = new Date();
    const diff = Math.floor((new Date(today.toDateString()) - new Date(d.toDateString())) / 86400000);
    if(diff === 0) return 'Today';
    if(diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { day:'numeric', month:'short', year: d.getFullYear() !== today.getFullYear() ? 'numeric' : undefined });
  }

  function renderRow(m, isLast, list, isEndOfGroup){
    const mine = m.from === ME;
    const row = document.createElement('div');
    row.className = 'row ' + (mine ? 'me' : 'them');

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const igMatch = !m.mediaType && m.text && m.text.match(IG_REGEX);

    const bubble = document.createElement('div');

    if(m.mediaType === 'image' || m.mediaType === 'video'){
      bubble.className = 'bubble media' + (isEndOfGroup ? ' tail' : '');
      const el = document.createElement(m.mediaType === 'image' ? 'img' : 'video');
      el.src = m.mediaData;
      if(m.mediaType === 'video'){ el.muted = true; el.setAttribute('playsinline',''); el.controls = false; }
      el.addEventListener('click', () => openLightbox(m.mediaType, m.mediaData));
      bubble.appendChild(el);
      if(m.text){
        const cap = document.createElement('div');
        cap.className = 'media-caption';
        cap.textContent = m.text;
        bubble.appendChild(cap);
      }
      bubble.addEventListener('click', (e) => { if(e.target === bubble) openEmojiBar(e, m); });
    } else if(igMatch){
      bubble.className = 'bubble media' + (isEndOfGroup ? ' tail' : '');
      bubble.appendChild(renderInstagramCard(igMatch[0]));
    } else {
      bubble.className = 'bubble' + (isEndOfGroup ? ' tail' : '');
      bubble.textContent = m.text;
      bubble.addEventListener('click', (e) => openEmojiBar(e, m));
    }
    wrap.appendChild(bubble);

    const reactionKeys = Object.keys(m.reactions || {});
    if(reactionKeys.length){
      const rDiv = document.createElement('div');
      rDiv.className = 'reactions';
      reactionKeys.forEach(who => {
        const chip = document.createElement('div');
        chip.className = 'reaction-chip';
        chip.textContent = m.reactions[who];
        rDiv.appendChild(chip);
      });
      wrap.appendChild(rDiv);
    }

    const time = document.createElement('div');
    time.className = 'meta';
    let label = new Date(m.ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if(mine && isLast){
      label += m.seen ? ' · Seen' : ' · Delivered';
    }
    time.textContent = label;
    wrap.appendChild(time);

    row.appendChild(wrap);
    return row;
  }

  // ---------- EMOJI REACTIONS ----------
  function openEmojiBar(e, message){
    activeEmojiTarget = message;
    const rect = e.currentTarget.getBoundingClientRect();
    const barWidth = 230;
    let left = rect.left + rect.width/2 - barWidth/2;
    left = Math.max(8, Math.min(left, window.innerWidth - barWidth - 8));
    emojiBar.style.left = left + 'px';
    emojiBar.style.top = (rect.top - 54 + window.scrollY) + 'px';
    emojiBar.classList.add('show');
  }
  document.addEventListener('click', (e) => {
    if(!emojiBar.contains(e.target) && !e.target.classList.contains('bubble')){
      emojiBar.classList.remove('show');
    }
  });
  emojiBar.querySelectorAll('span').forEach(span => {
    span.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!activeEmojiTarget) return;
      const emoji = span.dataset.e;
      span.classList.remove('picked'); void span.offsetWidth; span.classList.add('picked');
      vibrate(12);
      await reactOnServer(activeEmojiTarget.id, ME, emoji);
      await loadAndRender(true);
      emojiBar.classList.remove('show');
    });
  });

  function markSeenLoop(){
    // handled inside loadAndRender via polling
  }

})();
</script>
</body>
</html>
